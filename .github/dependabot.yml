version: 2
updates:
  # 1. Backend API Dependencies
  - package-ecosystem: "npm"
    directory: "/api"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "08:00"
    open-pull-requests-limit: 2
    # Group all updates to avoid individual PR noise and bundle updates together
    groups:
      dependencies:
        patterns:
          - "*"
    cooldown:
      default-days: 1
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # 2. Frontend Client Dependencies
  - package-ecosystem: "npm"
    directory: "/client"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 2
    groups:
      dependencies:
        patterns:
          - "*"
    cooldown:
      default-days: 1
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # 3. GitHub Actions Workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns:
          - "*"
    cooldown:
      default-days: 1
